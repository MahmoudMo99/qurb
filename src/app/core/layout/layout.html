<div class="app-shell" [class.focus-mode]="isFocusMode()">
  @if (!isFocusMode()) {
    <app-header></app-header>
  }

  <main class="app-main" [class.focus-mode]="isFocusMode()">
    <router-outlet></router-outlet>
  </main>

  @if (!isFocusMode()) {
    <app-footer></app-footer>
    <app-scroll-to-top></app-scroll-to-top>
  }
</div>
