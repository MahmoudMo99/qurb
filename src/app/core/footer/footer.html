<footer id="contact" class="site-footer">
  <div class="container">
    <div class="footer-main">
      <div class="footer-identity">
        <a routerLink="/home" class="footer-logo" aria-label="قُرب - الصفحة الرئيسية">
          <span class="logo-symbol">ق</span>
          <span class="logo-name">قُرب</span>
        </a>

        <p>مساحة هادئة للقرآن والذكر، أقرب ليومك.</p>
      </div>

      <nav class="footer-navigation" aria-label="روابط قُرب">
        @for (link of quickLinks; track link.route) {
          <a [routerLink]="link.route">
            {{ link.label }}
          </a>
        }
      </nav>

      <div class="footer-developer">
        <div class="developer-heading">
          <strong>محمود محمد</strong>
          <span>Software Engineer · Angular Developer</span>
        </div>

        <div class="developer-links">
          @for (link of externalLinks; track link.href) {
            <a [href]="link.href" target="_blank" rel="noopener noreferrer">
              {{ link.label }}
              <svg lucideArrowUpLeft aria-hidden="true"></svg>
            </a>
          }
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <span class="footer-credit"> صُنع بعناية، ليكون الخير أقرب. </span>

      <span class="footer-copyright" dir="ltr"> © {{ currentYear }} Mahmoud Mohamed </span>
    </div>
  </div>
</footer>
