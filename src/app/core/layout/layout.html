<div
  class="app-shell"
  [class.focus-mode]="isFocusMode()"
  [class.has-announcement]="!isFocusMode() && isAnnouncementVisible()"
>
  @if (!isFocusMode()) {
    @if (isAnnouncementVisible()) {
      <app-announcement-bar (closed)="hideAnnouncement()"></app-announcement-bar>
    }

    <app-header></app-header>
  }

  <main class="app-main" [class.focus-mode]="isFocusMode()">
    <router-outlet></router-outlet>
  </main>

  @if (!isFocusMode()) {
    <app-footer></app-footer>
    <app-scroll-to-top></app-scroll-to-top>
  }
</div>
